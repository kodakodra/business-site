name: PHP checks

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint PHP files
        shell: bash
        run: |
          set -e
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find config public src templates tests -type f -name '*.php' -print0)
      - name: Run smoke tests
        run: php tests/smoke.php
